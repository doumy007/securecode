[project]
name = "securecode-ai"
version = "1.0.0"
description = "Plataforma Inteligente para Auditoría Automatizada de Seguridad y Cumplimiento Normativo de Software"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncmy==0.2.10",
    "aiomysql==0.2.0",
    "pymysql==1.1.1",
    "alembic==1.13.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # bcrypt 4.1+ rompe passlib 1.7.4 (ValueError de 72 bytes en detect_wrap_bug)
    "bcrypt==4.0.1",
    "python-multipart==0.0.12",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    "openai==1.51.0",
    "aio-pika==9.4.3",
    "minio==7.2.10",
    "celery==5.4.0",
    "redis==5.1.1",
    "jinja2==3.1.4",
    "weasyprint==62.3",
    "openpyxl==3.1.5",
    "python-docx==1.1.2",
    "pyotp==2.9.0",
    "qrcode[pil]==7.4.2",
    "python-jose==3.3.0",
    "tenacity==9.0.0",
    "python-dateutil==2.9.0",
    "matplotlib==3.9.2",
    "plotly==5.24.1",
    "pandas==2.2.2",
    "numpy==2.1.1",
    "aiofiles==24.1.0",
    "watchfiles==0.24.0",
    "python-magic==0.4.27",
    "gitpython==3.1.43",
    "docker==7.1.0",
    "kubernetes==31.0.0",
    "defusedxml==0.7.1",
    "markdown==3.7",
    "bleach==6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.8",
    "mypy==1.11.2",
    "coverage==7.6.1",
    "factory-boy==3.3.0",
    "faker==30.3.0",
    "pre-commit==3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
