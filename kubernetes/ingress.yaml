apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securecode-ingress
  namespace: securecode
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  ingressClassName: nginx
  rules:
  - host: app.securecode.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: securecode-service
            port:
              number: 80
  tls:
  - hosts:
    - app.securecode.ai
    secretName: securecode-tls
