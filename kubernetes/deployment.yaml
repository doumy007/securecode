apiVersion: apps/v1
kind: Deployment
metadata:
  name: securecode-api
  namespace: securecode
  labels:
    app: securecode
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: securecode
      component: api
  template:
    metadata:
      labels:
        app: securecode
        component: api
    spec:
      containers:
      - name: api
        image: securecode/securecode-ai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: securecode-config
        - secretRef:
            name: securecode-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securecode-worker
  namespace: securecode
  labels:
    app: securecode
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securecode
      component: worker
  template:
    metadata:
      labels:
        app: securecode
        component: worker
    spec:
      containers:
      - name: worker
        image: securecode/securecode-worker:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: securecode-config
        - secretRef:
            name: securecode-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
