apiVersion: v1
kind: ConfigMap
metadata:
  name: securecode-config
  namespace: securecode
data:
  APP_ENV: "production"
  APP_PORT: "8000"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  RABBITMQ_HOST: "rabbitmq-service"
  REDIS_HOST: "redis-service"
  MINIO_ENDPOINT: "minio-service:9000"
  APP_LOG_LEVEL: "INFO"
  APP_CORS_ORIGINS: "https://app.securecode.ai"
---
apiVersion: v1
kind: Secret
metadata:
  name: securecode-secrets
  namespace: securecode
type: Opaque
stringData:
  DB_USER: "securecode"
  DB_PASSWORD: "securecode_pass"
  DB_NAME: "securecode_db"
  JWT_SECRET_KEY: "change-this-in-production"
  OPENAI_API_KEY: "your-openai-key"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
