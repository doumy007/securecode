<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureCode AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div id="app">
  <div id="loading-screen" class="d-flex justify-content-center align-items-center vh-100">
    <div class="text-center">
      <div class="spinner-border text-primary mb-2" role="status" style="width:2rem;height:2rem"></div>
      <p class="text-secondary small">Cargando SecureCode AI...</p>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div id="page-login" class="d-none">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card" style="max-width:360px;width:100%">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <i class="bi bi-shield-check text-primary" style="font-size:1.8rem"></i>
          <h6 class="mt-1 fw-normal">SecureCode AI</h6>
          <p class="text-secondary small">Auditoría de Seguridad</p>
        </div>
        <div id="login-alert" class="alert alert-danger d-none py-1 small"></div>
        <form id="login-form">
          <div class="mb-2"><label class="text-secondary small">Usuario</label>
            <input type="text" class="form-control" id="login-username" placeholder="admin" required></div>
          <div class="mb-3"><label class="text-secondary small">Contraseña</label>
            <input type="password" class="form-control" id="login-password" placeholder="••••••" required></div>
          <button type="submit" class="btn btn-primary w-100 mb-2" id="login-btn">
            <span class="spinner-border spinner-border-sm d-none" id="login-spinner"></span>
            <span id="login-text">Ingresar</span></button>
        </form>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm w-50" id="seed-btn" onclick="seedRoles()"><i class="bi bi-database"></i> Seed</button>
          <button class="btn btn-outline-secondary btn-sm w-50" onclick="showRegister()"><i class="bi bi-person-plus"></i> Registrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- REGISTER MODAL -->
<div class="modal fade" id="register-modal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Registrar</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="reg-alert" class="alert alert-warning d-none py-1 small"></div>
        <form id="register-form">
          <div class="mb-2"><label class="text-secondary small">Usuario</label><input class="form-control" id="reg-username" required></div>
          <div class="mb-2"><label class="text-secondary small">Email</label><input type="email" class="form-control" id="reg-email" required></div>
          <div class="mb-2"><label class="text-secondary small">Nombre</label><input class="form-control" id="reg-nombre"></div>
          <div class="mb-2"><label class="text-secondary small">Contraseña</label><input type="password" class="form-control" id="reg-password" required></div>
          <button type="submit" class="btn btn-primary btn-sm w-100">Registrarse</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- LAYOUT -->
<div id="page-layout" class="d-none">
  <div class="d-flex" id="wrapper">
    <nav class="sidebar d-flex flex-column flex-shrink-0 p-3" id="sidebar">
      <a class="d-flex align-items-center mb-3 text-decoration-none" href="#/">
        <i class="bi bi-shield-check text-primary me-2 fs-5"></i>
        <span class="fw-semibold small">SecureCode</span>
      </a>
      <hr>
      <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li><a class="nav-link" href="#/"><i class="bi bi-grid me-2"></i><span>Dashboard</span></a></li>
        <li><a class="nav-link" href="#/projects"><i class="bi bi-folder me-2"></i><span>Proyectos</span></a></li>
        <li><a class="nav-link" href="#/audits"><i class="bi bi-shield me-2"></i><span>Auditorías</span></a></li>
        <li><a class="nav-link" href="#/profile"><i class="bi bi-person me-2"></i><span>Perfil</span></a></li>
      </ul>
      <hr>
      <div class="dropdown">
        <a class="d-flex align-items-center text-decoration-none dropdown-toggle small" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle me-2"></i><span id="sidebar-user">usuario</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark shadow-sm">
          <li><a class="dropdown-item small" href="#/profile"><i class="bi bi-gear me-2"></i>Perfil</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item small text-danger" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Salir</a></li>
        </ul>
      </div>
    </nav>
    <div class="main-content flex-grow-1 p-3 p-md-4" id="page-content"></div>
  </div>
</div>

<!-- MODALS -->
<div class="modal fade" id="project-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Nuevo Proyecto</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="proj-alert" class="alert alert-danger d-none py-1 small"></div>
        <form id="project-form">
          <div class="mb-2"><label class="text-secondary small">Nombre</label><input class="form-control" id="proj-nombre" required></div>
          <div class="mb-2"><label class="text-secondary small">Descripción</label><textarea class="form-control" id="proj-desc" rows="2"></textarea></div>
          <button type="submit" class="btn btn-primary btn-sm w-100">Crear</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="detail-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title"><i class="bi bi-journal-code me-1 text-primary"></i><span id="detail-title">Proyecto</span></h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="detail-body"></div>
    </div>
  </div>
</div>

<div class="modal fade" id="audit-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Nueva Auditoría</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="audit-alert" class="alert alert-danger d-none py-1 small"></div>
        <form id="audit-form">
          <div class="mb-2"><label class="text-secondary small">Proyecto</label>
            <select class="form-select" id="audit-proyecto" required><option value="">Seleccionar...</option></select></div>
          <div class="mb-2"><label class="text-secondary small">Nombre</label><input class="form-control" id="audit-nombre" placeholder="Auditoría automatizada"></div>
          <div class="mb-2"><label class="text-secondary small">URL Git (opcional)</label><input class="form-control" id="audit-git" placeholder="https://github.com/usuario/repo.git"></div>
          <div class="mb-2">
            <label class="text-secondary small d-block mb-1">Frameworks</label>
            <div id="framework-checks" class="d-flex flex-wrap gap-2"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-sm w-100">Iniciar Auditoría</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- TEMPLATES -->
<template id="tpl-dashboard">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h6 class="fw-normal mb-0"><i class="bi bi-grid me-2"></i>Dashboard</h6>
    <small class="text-secondary" id="dash-date"></small>
  </div>
  <div class="row g-2 mb-3" id="dash-cards"></div>
  <div class="row g-2">
    <div class="col-md-8"><div class="card"><div class="card-body"><canvas id="chart-trend" height="150"></canvas></div></div></div>
    <div class="col-md-4"><div class="card"><div class="card-body"><canvas id="chart-severity" height="150"></canvas></div></div></div>
  </div>
</template>

<template id="tpl-projects">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h6 class="fw-normal mb-0"><i class="bi bi-folder me-2"></i>Proyectos</h6>
    <button class="btn btn-primary btn-sm" onclick="showNewProject()"><i class="bi bi-plus-lg"></i> Nuevo</button>
  </div>
  <div class="input-group input-group-sm mb-3" style="max-width:280px">
    <span class="input-group-text bg-transparent text-secondary"><i class="bi bi-search"></i></span>
    <input class="form-control" placeholder="Buscar..." id="project-search" oninput="renderProjectList()">
  </div>
  <div id="project-list" class="row g-2"></div>
  <p id="project-empty" class="text-secondary text-center small d-none">No hay proyectos.</p>
</template>

<template id="tpl-project-card">
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 project-card" onclick="showProjectDetail('{id}')">
      <div class="card-body p-3">
        <h6 class="card-title mb-1"><i class="bi bi-journal-code me-1 text-primary"></i>{nombre}</h6>
        <p class="small text-secondary mb-2">{descripcion}</p>
        <div class="d-flex justify-content-between align-items-center">
          <span class="badge bg-primary-subtle text-primary small">{lenguaje}</span>
          <small class="text-secondary">{framework}</small>
        </div>
      </div>
      <div class="card-footer p-2 d-flex justify-content-between">
        <small class="text-secondary">{created_at|raw}</small>
        <small class="text-secondary"><i class="bi bi-shield me-1"></i>{auditorias_count}</small>
      </div>
    </div>
  </div>
</template>

<template id="tpl-audits">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h6 class="fw-normal mb-0"><i class="bi bi-shield me-2"></i>Auditorías</h6>
    <button class="btn btn-primary btn-sm" onclick="showNewAudit()"><i class="bi bi-plus-lg"></i> Nueva</button>
  </div>
  <div id="audit-list"></div>
  <p id="audit-empty" class="text-secondary text-center small d-none">No hay auditorías.</p>
</template>

<template id="tpl-audit-row">
  <div class="card mb-2">
    <div class="card-body p-3 d-flex justify-content-between align-items-center">
      <div>
        <h6 class="mb-1 small"><i class="bi bi-bug me-1 text-primary"></i>{nombre}</h6>
        <small class="text-secondary">Proyecto: <span class="text-light">{proyecto_nombre}</span> &middot; {tipo}</small>
      </div>
      <div class="text-end">
        <span class="badge bg-{estado_color} small">{estado}</span>
        <small class="d-block text-secondary mt-1">{created_at|raw}</small>
      </div>
    </div>
  </div>
</template>

<template id="tpl-profile">
  <h6 class="fw-normal mb-3"><i class="bi bi-person me-2"></i>Perfil</h6>
  <div class="row g-2">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body p-3">
          <table class="table table-borderless mb-0 small">
            <tr><td class="text-secondary ps-0">Usuario</td><td class="pe-0 text-end" id="prof-username"></td></tr>
            <tr><td class="text-secondary ps-0">Email</td><td class="pe-0 text-end" id="prof-email"></td></tr>
            <tr><td class="text-secondary ps-0">Nombre</td><td class="pe-0 text-end" id="prof-nombre"></td></tr>
            <tr><td class="text-secondary ps-0">Rol</td><td class="pe-0 text-end"><span class="badge bg-primary small" id="prof-rol"></span></td></tr>
          </table>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header p-2"><small class="fw-semibold">Cambiar Contraseña</small></div>
        <div class="card-body p-3">
          <div id="pw-alert" class="alert alert-danger d-none py-1 small"></div>
          <form id="pw-form">
            <div class="mb-2"><label class="text-secondary small">Actual</label><input type="password" class="form-control" id="pw-old" required></div>
            <div class="mb-2"><label class="text-secondary small">Nueva</label><input type="password" class="form-control" id="pw-new" required></div>
            <button type="submit" class="btn btn-primary btn-sm w-100">Actualizar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
